<title>Ome Jan Beurtbier</title>
<meta name="theme-color" content="#c8102e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Beurtbier" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  :root {
    --red: #c8102e; --red-dark: #8a0c22; --gold: #f4b400; --ink: #17181a;
    --muted: #6b7280; --line: #e6e3de; --good: #16834a; --bg: #f7f5f1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  .shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: var(--ink); color: #fff; gap: 10px; }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-eyebrow { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 1.2px; color: var(--gold); font-weight: 700; }
  .header-title { font-family: "Oswald", sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; }
  .header-pill { font-size: 11.5px; background: rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .tabbar { display: flex; border-bottom: 1px solid var(--line); background: #fff; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab-btn { flex: 0 0 auto; padding: 11px 10px; background: none; border: none; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
  .main { padding: 18px 16px 32px; min-height: 200px; flex: 1; }
  .section-head { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; font-weight: 700; margin: 18px 0 10px; }
  .section-head:first-child { margin-top: 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .info-note { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.55; }
  .info-note svg { vertical-align: -2px; margin-right: 4px; }
  .empty-state { text-align: center; padding: 2rem 1rem; border: 1px dashed var(--line); border-radius: 10px; }
  .empty-title { font-weight: 600; margin: 0 0 4px; }
  .empty-body { font-size: 13px; color: var(--muted); margin: 0; }
  .btn-primary { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-primary:disabled { opacity: 0.45; }
  .btn-primary-sm { background: var(--red); color: #fff; border: none; border-radius: 7px; padding: 9px 16px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .btn-primary-sm:disabled { opacity: 0.45; }
  .btn-ghost-sm { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; font-size: 12.5px; color: var(--ink); font-weight: 500; }
  .btn-ghost-sm.danger { color: var(--red); border-color: #f2c7cd; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .input { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); font-size: 14px; background: #fff; color: var(--ink); }
  .form-row > .input { flex: 1 1 130px; min-width: 130px; }
  .toggle-group { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .toggle-btn { padding: 9px 14px; background: #fff; border: none; font-size: 13px; color: var(--muted); }
  .toggle-btn.active { background: var(--red); color: #fff; }
  .roster-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .roster-row:last-child { border-bottom: none; }
  .roster-name { flex: 1; font-size: 14px; font-weight: 600; }
  .roster-sub { font-size: 11.5px; color: var(--muted); }
  .checkbox { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  .checkbox.on { background: var(--red); border-color: var(--red); }
  .chip-btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; }
  .chip-btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .step-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 17px; font-weight: 700; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .step-btn:disabled { opacity: 0.3; }
  .step-count { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 16px; min-width: 22px; text-align: center; }
  .match-switch-row { margin-bottom: 10px; }
  .match-switch-select { width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); font-size: 13.5px; background: #fff; color: var(--ink); }
  .match-detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .head-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); background: #efece6; padding: 3px 8px; border-radius: 5px; }
  .match-detail-title { font-family: "Oswald", sans-serif; font-size: 23px; font-weight: 700; margin: 4px 0 2px; }
  .match-detail-date { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .stand-table { overflow-x: auto; }
  .stand-head-row, .stand-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 1fr; gap: 6px; align-items: center; padding: 7px 0; }
  .stand-head-row { border-bottom: 1px solid var(--line); font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .stand-row { border-bottom: 1px solid #f1efe9; font-size: 13px; }
  .stand-name { font-weight: 600; }
  .stand-col { text-align: right; }
  .scroll-hint { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 2px; }
  .reveal-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .reveal-item { font-family: "JetBrains Mono", monospace; color: var(--ink); font-size: 12px; background: #f3f1ec; border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .icon-btn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; padding: 0; }
  .settle-list { display: flex; flex-direction: column; gap: 8px; }
  .settle-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: #f6f4ef; border-radius: 8px; font-size: 13.5px; }
  .lock-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  /* ---- schermvullende trekking: "rad/gokkast"-gevoel ---- */
  .draw-overlay {
    position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, var(--red-dark) 0%, #2a0810 65%, #150408 100%);
    padding: 24px; text-align: center;
  }
  .draw-overlay-eyebrow { font-family: "JetBrains Mono", monospace; letter-spacing: 2px; font-size: clamp(11px, 3vw, 14px); color: var(--gold); font-weight: 700; text-transform: uppercase; margin-bottom: 18px; }
  .draw-reel-box {
    width: 100%; max-width: 420px; background: rgba(0,0,0,0.28); border: 2px solid rgba(244,180,0,0.35);
    border-radius: 22px; padding: clamp(22px, 8vw, 44px) 14px; box-shadow: 0 0 60px rgba(0,0,0,0.5) inset, 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .draw-reel-box.locked { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(244,180,0,0.25), 0 0 60px rgba(244,180,0,0.35); }
  .draw-reel-name {
    font-family: "Oswald", sans-serif; font-weight: 700; color: #fff; line-height: 1.05;
    font-size: clamp(34px, 13vw, 76px); word-break: break-word;
  }
  .draw-reel-box.locked .draw-reel-name { color: var(--gold); animation: drawlock 0.5s ease-out; }
  .draw-reel-name.ticking { animation: drawtick 0.12s ease-out; }
  @keyframes drawtick { from { transform: scale(1.1) translateY(-6px); opacity: 0.5; filter: blur(1px); } to { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); } }
  @keyframes drawlock { 0% { transform: scale(0.7); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .draw-overlay-sub { margin-top: 20px; color: rgba(255,255,255,0.75); font-size: clamp(13px, 3.4vw, 16px); font-weight: 600; min-height: 22px; }
  .draw-overlay-count { margin-top: 6px; color: rgba(255,255,255,0.5); font-size: 12px; font-family: "JetBrains Mono", monospace; }
  .draw-picked-list { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .draw-picked-chip { background: rgba(244,180,0,0.18); border: 1px solid rgba(244,180,0,0.4); color: var(--gold); border-radius: 20px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; }
  .lock-box { max-width: 360px; width: 100%; text-align: center; }
  .lock-input { width: 100%; text-align: center; letter-spacing: 2px; font-size: 18px; padding: 13px; border-radius: 9px; border: 1px solid var(--line); margin: 14px 0 10px; }
  .onboard-title { font-family: "Oswald", sans-serif; font-size: 22px; font-weight: 700; margin: 14px 0 4px; }
  .onboard-sub { font-size: 13px; color: var(--muted); margin: 0 0 6px; line-height: 1.5; }
  .error-text { color: var(--red); font-size: 12.5px; font-weight: 600; margin-top: 6px; }
  .member-chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .member-chip { display: inline-flex; align-items: center; gap: 6px; background: #f3f1ec; border-radius: 20px; padding: 6px 6px 6px 12px; font-size: 12.5px; font-weight: 600; }
  .chip-remove { width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 0; }
  .gold-note { font-size: 12px; background: #3a2e00; color: var(--gold); padding: 9px 11px; border-radius: 8px; margin-bottom: 10px; }
  .good-badge { display: flex; align-items: center; gap: 8px; color: var(--good); font-weight: 700; font-size: 13.5px; }
  img.wapen { display: block; }
  [hidden] { display: none !important; }
</style>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  /* ================= helpers ================= */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function clamp0(n) { return Math.max(0, Math.floor(n) || 0); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function euro(n) { return "€" + (Math.round((n || 0) * 100) / 100).toFixed(2).replace(".", ","); }
  function euroSigned(n) { n = Math.round((n || 0) * 100) / 100; return (n > 0.004 ? "+" : "") + euro(n); }
  function weightedPick(candidates, weights) {
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < candidates.length; i++) { r -= weights[i]; if (r <= 0) return i; }
    return candidates.length - 1;
  }
  function getLocal(key, fallback) { try { var v = localStorage.getItem("bb2_" + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
  function setLocal(key, val) { try { localStorage.setItem("bb2_" + key, JSON.stringify(val)); } catch (e) {} }

  function icon(name, size, extra) {
    size = size || 16;
    var body = {
      check: '<polyline points="20 6 9 17 4 12"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      chevronRight: '<polyline points="9 18 15 12 9 6"/>',
      calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
      dice: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.2"/><circle cx="16" cy="8" r="1.2"/><circle cx="8" cy="16" r="1.2"/><circle cx="16" cy="16" r="1.2"/><circle cx="12" cy="12" r="1.2"/>',
      info: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/>',
      beer: '<path d="M6 9h10v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9Z"/><path d="M16 11h1.5a2 2 0 0 1 0 4H16"/><path d="M6 9c0-2.5 1-4 3-5"/>',
      trophy: '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
      lock: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'
    }[name] || "";
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (extra || "") + ">" + body + "</svg>";
  }
  function alkmaarWapen(size) {
    size = size || 40; var h = size * (110 / 140);
    return (
      '<svg viewBox="0 0 140 110" width="' + size + '" height="' + h + '" aria-label="Ome Jan Beurtbier logo">' +
      '<circle cx="70" cy="56" r="52" fill="var(--red)"/>' +
      '<path d="M9,60 H31 L28,92 H12 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.2"/>' +
      '<ellipse cx="20" cy="59.5" rx="12" ry="4.5" fill="#fff" stroke="var(--ink)" stroke-width="1"/>' +
      '<path d="M131,60 H109 L112,92 H128 Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.2"/>' +
      '<ellipse cx="120" cy="59.5" rx="12" ry="4.5" fill="#fff" stroke="var(--ink)" stroke-width="1"/>' +
      '<circle cx="70" cy="52" r="27" fill="#fff" stroke="var(--red-dark)" stroke-width="2"/>' +
      [0, 1, 2, 3, 4].map(function (i) { return '<rect x="' + (51 + i * 9.5) + '" y="21" width="6" height="9" fill="#fff" stroke="var(--red-dark)" stroke-width="1"/>'; }).join("") +
      '<rect x="61" y="60" width="18" height="20" rx="1" fill="var(--ink)"/>' +
      "</svg>"
    );
  }

  /* ================= producten & prijzen ================= */
  var defaultSettings = { pricePerBeer: 5.99, colaPrice: 2.5, bier0Price: 3.5, cupsPerRun: 8 };
  function productPrice(product, settings) {
    if (product === "cola") return settings.colaPrice != null ? settings.colaPrice : 2.5;
    if (product === "bier0") return settings.bier0Price != null ? settings.bier0Price : 3.5;
    return settings.pricePerBeer != null ? settings.pricePerBeer : 5.99;
  }
  function productLabel(product) {
    if (product === "cola") return "Cola";
    if (product === "bier0") return "Bier 0.0";
    return "Bier";
  }

  /* ================= state ================= */
  function emptyMatchData() { return { attendees: [], rounds: [], predictions: {}, archived: false, archivedSummary: null }; }
  function defaultState() {
    return { adminPasscode: null, members: [], matches: [], settings: Object.assign({}, defaultSettings), matchData: {}, haulHistory: {} };
  }
  function normalizeState(raw) {
    var s = raw && typeof raw === "object" ? raw : {};
    s.members = s.members || [];
    s.matches = s.matches || [];
    s.settings = Object.assign({}, defaultSettings, s.settings || {});
    s.matchData = s.matchData || {};
    s.haulHistory = s.haulHistory || {};
    Object.keys(s.matchData).forEach(function (mid) {
      var md = s.matchData[mid];
      if (!md) return;
      if (!Array.isArray(md.attendees)) md.attendees = [];
      if (!Array.isArray(md.rounds)) md.rounds = [];
      if (!md.predictions) md.predictions = {};
    });
    return s;
  }

  var state = defaultState();
  var sb = null;
  var supabaseReady = false;
  var loadError = "";
  var savePending = false;
  var saveError = false;

  function matchData(id) {
    if (!state.matchData[id]) state.matchData[id] = emptyMatchData();
    return state.matchData[id];
  }
  function memberName(id) {
    var m = state.members.find(function (mm) { return mm.id === id; });
    return m ? m.name : "?";
  }
  function roundHalers(round) { return (round && round.halers) || []; }

  /* ================= opslag & verbinding =================
     Eén beheerder-apparaat tegelijk is de "echte" schrijver. Geen
     ingewikkelde atomaire database-functies meer nodig (die waren puur om
     15 gelijktijdige TELEFOONS elkaar niet te laten overschrijven) — met
     precies één persoon die alles intikt, is een simpele "hele staat lezen,
     aanpassen, terugschrijven" ruim voldoende, en juist veel sneller en
     minder foutgevoelig. */
  function getSupaConfig() { return { url: getLocal("supa_url", ""), key: getLocal("supa_key", "") }; }
  function setSupaConfig(url, key) { setLocal("supa_url", url); setLocal("supa_key", key); }

  async function publishState(next, attempt) {
    attempt = attempt || 1;
    if (!sb) { render(); return; }
    savePending = true; render();
    try {
      var res = await sb.from("kv_store").update({ value: next, updated_at: new Date().toISOString() }).eq("key", "app_state");
      if (res.error) throw res.error;
      saveError = false; savePending = false; render();
    } catch (e) {
      if (attempt < 3) { await sleep(400 * attempt); return publishState(next, attempt + 1); }
      savePending = false; saveError = true; console.error("opslaan mislukt", e); render();
    }
  }
  var debounceTimer = null;
  function mutate(mutator, immediate) {
    var next = mutator(clone(state)) || state;
    state = next;
    render();
    if (immediate) { clearTimeout(debounceTimer); publishState(next); return; }
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () { publishState(state); }, 350);
  }

  async function initSupabase() {
    try {
      var cfg = getSupaConfig();
      if (!cfg.url || !cfg.key) { render(); return; }
      if (!window.supabase || typeof window.supabase.createClient !== "function") {
        loadError = "Kon de Supabase-bibliotheek niet laden — controleer je internetverbinding en laad de pagina opnieuw.";
        render(); return;
      }
      sb = window.supabase.createClient(cfg.url, cfg.key);
      var res = await sb.from("kv_store").select("value").eq("key", "app_state").maybeSingle();
      if (res.error) throw res.error;
      if (res.data && res.data.value && Object.keys(res.data.value).length > 0) {
        state = normalizeState(res.data.value);
      } else {
        state = defaultState();
        var ins = await sb.from("kv_store").upsert({ key: "app_state", value: state, updated_at: new Date().toISOString() });
        if (ins.error) throw ins.error;
      }
      supabaseReady = true; render();
      sb.channel("kv_store_changes")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "kv_store", filter: "key=eq.app_state" }, function (payload) {
          if (!payload || !payload.new) return;
          state = normalizeState(payload.new.value);
          savePending = false;
          render();
        })
        .subscribe();
    } catch (e) {
      console.error("Supabase init mislukt", e);
      loadError = "Kon geen verbinding maken met de database. Controleer of het SQL-installatiescript is uitgevoerd, en of de Project URL en key kloppen." + ((e && e.message) ? " (" + e.message + ")" : "");
      render();
    }
  }

  /* ================= UI-only state ================= */
  var ui = {
    unlocked: getLocal("admin_unlocked", false),
    activeTab: "wedstrijd",
    selectedMatchId: null,
    explicitlyBrowsing: false,
    draw: null, // { picksNeeded, picked: [{personId, qty}], spinName, locked: boolean, phase: 'spinning'|'locked'|'done' }
    passInput: "",
    lockError: "",
    drafts: { newMemberName: "", newMatch: { date: "", time: "", opponent: "", competition: "Eredivisie", isHome: true }, passcode: "", supaUrl: "", supaKey: "" },
    roundDraft: null // { matchId, wanters: {personId: {qty, product}}, mode: 'auto'|'manual', manualHalers: [] }
  };

  /* ================= app-acties ================= */
  var app = {};

  /* ---- wedstrijden ---- */
  app.addMatch = function () {

    var match = { id: uid(), date: nm.date, time: nm.time || null, opponent: nm.opponent.trim(), competition: nm.competition, isHome: nm.isHome, finalScore: null, finalScoreAt: null, settled: false, settledAt: null };
    mutate(function (d) { d.matches = d.matches.concat([match]); return d; }, true);

  app.removeMatch = function (id) {
    mutate(function (d) { d.matches = d.matches.filter(function (m) { return m.id !== id; }); delete d.matchData[id]; return d; }, true);
  };
  app.setNewMatchHome = function (v) { ui.drafts.newMatch.isHome = v; render(); };
  app.updateMatchTime = function (matchId, time) {
    mutate(function (d) { d.matches = d.matches.map(function (m) { return m.id === matchId ? Object.assign({}, m, { time: time || null }) : m; }); return d; });
  };
  app.setMatchFinalScore = function (matchId, home, away) {
    mutate(function (d) {
      d.matches = d.matches.map(function (m) {
        if (m.id !== matchId) return m;
        var hasScore = home !== null && away !== null && home !== "" && away !== "";
        return Object.assign({}, m, { finalScore: hasScore ? { home: +home, away: +away } : null, finalScoreAt: hasScore ? (m.finalScoreAt || Date.now()) : null });
      });
      return d;
    }, true);
  };
  app.setMatchSettled = function (matchId, settled) {
    mutate(function (d) {

  app.updateSetting = function (key, value) {

  /* ---- aanwezigen (wie drinkt vandaag) ---- */

  /* ---- gokken (beheerder vult in namens iedereen) ---- */
  app.setPrediction = function (matchId, personId, home, away) {

  /* ---- ronde-invoer (alles door de beheerder) ---- */
  app.resetRoundDraft = function () { ui.roundDraft = null; };
  app.startRoundDraft = function (matchId) {
    ui.roundDraft = { matchId: matchId, wanters: {}, mode: "auto", manualHalers: [] };
    render();
  };
  app.cancelRoundDraft = function () { ui.roundDraft = null; render(); };
  app.toggleWant = function (personId) {
    var rd = ui.roundDraft;
    if (!rd) return;
    if (rd.wanters[personId]) delete rd.wanters[personId];
    else rd.wanters[personId] = { qty: 1, product: "bier" };
    render();
  };
  app.setWantQty = function (personId, qty) {
    var rd = ui.roundDraft; if (!rd || !rd.wanters[personId]) return;
    qty = clamp0(qty);
    if (qty === 0) delete rd.wanters[personId];
    else rd.wanters[personId].qty = qty;

  };
  app.setWantProduct = function (personId, product) {
    var rd = ui.roundDraft; if (!rd || !rd.wanters[personId]) return;
    rd.wanters[personId].product = product; render();
  };
  app.setRoundMode = function (mode) { if (ui.roundDraft) { ui.roundDraft.mode = mode; render(); } };
  app.toggleManualHaler = function (personId) {
    var rd = ui.roundDraft; if (!rd) return;
    var i = rd.manualHalers.indexOf(personId);
    if (i === -1) rd.manualHalers = rd.manualHalers.concat([personId]);
    else rd.manualHalers = rd.manualHalers.filter(function (p) { return p !== personId; });
    render();
  };

  function buildWanters(rd) {
    return Object.keys(rd.wanters).map(function (pid) { return { personId: pid, qty: rd.wanters[pid].qty, product: rd.wanters[pid].product }; }).filter(function (w) { return w.qty > 0; });
  }
  function splitEvenly(ids, total) {
    var base = Math.floor(total / ids.length), extra = total % ids.length;
    return ids.map(function (pid, i) { return { personId: pid, qty: base + (i < extra ? 1 : 0) }; });
  }

  // Schermvullende trekking: een reeks tikken die steeds trager worden (net
  // als een rad/gokkast dat tot stilstand komt) en dan "vastklikt" op de
  // gewonnen naam, voordat we (bij meerdere halers) aan de volgende trekking
  // beginnen. De kansberekening zelf (gewogen loting) is ongewijzigd t.o.v.
  // eerdere versies van de app.
  function tickDelays() {
    // Van snel (60ms) naar traag (260ms) over ongeveer 16 tikken — voelt als
    // afremmen in plaats van abrupt stoppen.
    var delays = [];
    for (var i = 0; i < 16; i++) delays.push(Math.round(60 + (260 - 60) * Math.pow(i / 15, 1.7)));
    return delays;
  }
  app.confirmAutoDraw = async function () {
    var rd = ui.roundDraft; if (!rd) return;
    var wanters = buildWanters(rd);
    var total = wanters.reduce(function (s, w) { return s + w.qty; }, 0);
    if (total === 0) return;
    var matchId = rd.matchId;
    var md = matchData(matchId);
    var attendees = md.attendees || [];
    var cap = state.settings.cupsPerRun || 8;
    var numHalers = Math.max(1, Math.min(attendees.length, Math.ceil(total / cap)));
    var historical = state.haulHistory || {};
    var todayCounts = {};
    (md.rounds || []).forEach(function (r) { roundHalers(r).forEach(function (h) { todayCounts[h.personId] = (todayCounts[h.personId] || 0) + 1; }); });
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var winners = [];
    var pool = attendees.slice();
    ui.draw = { picksNeeded: numHalers, picked: [], spinName: "", phase: "spinning", tick: 0 };
    render();
    for (var k = 0; k < numHalers; k++) {
      var weights = pool.map(function (pid) { return 1 / (1 + (historical[pid] || 0) + (todayCounts[pid] || 0) * 2); });
      var idx = weightedPick(pool, weights);
      var winnerId = pool[idx];
      if (!reduceMotion) {
        var delays = tickDelays();
        for (var t = 0; t < delays.length; t++) {
          ui.draw.spinName = memberName(pool[Math.floor(Math.random() * pool.length)]);
          ui.draw.tick = (ui.draw.tick || 0) + 1;
          render();
          await sleep(delays[t]);
        }
      }
      ui.draw.phase = "locked"; ui.draw.spinName = memberName(winnerId); render();
      await sleep(reduceMotion ? 250 : 1100);
      winners.push(winnerId);
      ui.draw.picked = winners.map(function (pid) { return memberName(pid); });
      pool.splice(idx, 1);
      if (k < numHalers - 1) { ui.draw.phase = "spinning"; render(); await sleep(300); }
    }
    ui.draw = null;
    finalizeRound(matchId, wanters, splitEvenly(winners, total), false);
  };
  app.confirmManualRound = function () {
    var rd = ui.roundDraft; if (!rd) return;
    var wanters = buildWanters(rd);
    var total = wanters.reduce(function (s, w) { return s + w.qty; }, 0);
    if (total === 0 || rd.manualHalers.length === 0) return;
    finalizeRound(rd.matchId, wanters, splitEvenly(rd.manualHalers, total), true);
  };
  function finalizeRound(matchId, wanters, halers, manual) {
    var round = { id: uid(), wanters: wanters, halers: halers, ts: Date.now(), manual: manual };
    mutate(function (d) {
      var md = d.matchData[matchId] || (d.matchData[matchId] = emptyMatchData());
      md.rounds = (md.rounds || []).concat([round]);
      d.haulHistory = Object.assign({}, d.haulHistory);
      halers.forEach(function (h) { d.haulHistory[h.personId] = (d.haulHistory[h.personId] || 0) + 1; });
      return d;
    }, true);
    ui.roundDraft = null; render();
  }
  app.removeRound = function (matchId, roundId) {
    mutate(function (d) {
      var md = d.matchData[matchId];
      if (!md) return d;
      md.rounds = md.rounds.filter(function (r) { return r.id !== roundId; });
      return d;
    }, true);
  };

  /* ================= afrekening ================= */
  function computeNetBalances(attendees, rounds, settings, predictions, finalScore, finalScoreAt) {
    var net = {}, matchNet = {}, breakdown = {};
    var ensure = function (obj, id) { if (obj[id] === undefined) obj[id] = 0; };
    var ensureBk = function (id) { if (!breakdown[id]) breakdown[id] = { haaldeCredit: 0, haaldeAantal: 0, dronkDebit: 0, dronkAantal: 0, gokAdjust: 0 }; return breakdown[id]; };
    var totalBought = 0;
    rounds.forEach(function (round) {
      var isMatchRound = !finalScoreAt || (round.ts || 0) < finalScoreAt;
      var halers = roundHalers(round);
      var queue = [];
      (round.wanters || []).forEach(function (w) { for (var i = 0; i < w.qty; i++) queue.push({ personId: w.personId, product: w.product || "bier" }); });
      var qIdx = 0;
      halers.forEach(function (h) {
        ensure(net, h.personId); var bk = ensureBk(h.personId);
        var haulQty = h.qty || 0; var haulCredit = 0;
        for (var i2 = 0; i2 < haulQty; i2++) {
          if (qIdx < queue.length) {
            var item = queue[qIdx]; qIdx++;
            var unitPrice = productPrice(item.product, settings);
            haulCredit += unitPrice;
            ensure(net, item.personId); net[item.personId] -= unitPrice;
            if (isMatchRound) { ensure(matchNet, item.personId); matchNet[item.personId] -= unitPrice; }
            var bkD = ensureBk(item.personId); bkD.dronkAantal += 1; bkD.dronkDebit -= unitPrice;
          } else {
            haulCredit += settings.pricePerBeer || 0;
          }
        }
        totalBought += haulQty;
        net[h.personId] += haulCredit;
        if (isMatchRound) { ensure(matchNet, h.personId); matchNet[h.personId] += haulCredit; }
        bk.haaldeAantal += haulQty; bk.haaldeCredit += haulCredit;
      });
    });
    var predEntries = Object.entries(predictions || {});
    var winnerIds = [], loserIds = [];
    if (finalScore && predEntries.length > 0) {
      predEntries.forEach(function (e) {
        var p = e[1];
        if (p && p.home === finalScore.home && p.away === finalScore.away) winnerIds.push(e[0]); else loserIds.push(e[0]);
      });
    }
    var forgivenTotal = 0;
    if (winnerIds.length > 0 && loserIds.length > 0) {
      winnerIds.forEach(function (pid) {
        var matchDebt = matchNet[pid] || 0;
        if (matchDebt < 0) { forgivenTotal += -matchDebt; ensure(net, pid); net[pid] -= matchDebt; ensureBk(pid).gokAdjust -= matchDebt; }
      });
      var perLoser = forgivenTotal / loserIds.length;
      loserIds.forEach(function (pid) { ensure(net, pid); net[pid] -= perLoser; ensureBk(pid).gokAdjust -= perLoser; });
    }
    return { net: net, breakdown: breakdown, totalBought: totalBought, winnerIds: winnerIds, loserIds: loserIds, forgivenTotal: forgivenTotal };
  }
  function settleNet(net) {
    var creditors = [], debtors = [];
    Object.keys(net).forEach(function (pid) {
      var v = Math.round(net[pid] * 100) / 100;
      if (v > 0.004) creditors.push({ pid: pid, amt: v }); else if (v < -0.004) debtors.push({ pid: pid, amt: -v });
    });
    creditors.sort(function (a, b) { return b.amt - a.amt; }); debtors.sort(function (a, b) { return b.amt - a.amt; });
    var tx = []; var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
      var c = creditors[ci], dd = debtors[di];
      var amt = Math.min(c.amt, dd.amt);
      tx.push({ from: dd.pid, to: c.pid, amt: amt });
      c.amt -= amt; dd.amt -= amt;
      if (c.amt < 0.005) ci++; if (dd.amt < 0.005) di++;
    }
    return tx;
  }

  /* ================= archivering (grote blob klein houden) =================
     Na elke 5 afgerekende wedstrijden wordt de oudste automatisch
     samengevat: de losse rondes verdwijnen, het eindbedrag per persoon
     (archivedSummary) blijft voor altijd gewoon zichtbaar. haulHistory
     (voor de eerlijke loting) staat los van de rondes zelf, dus die blijft
     ook daarna gewoon kloppen. */
  var ARCHIVE_KEEP_RECENT = 5;
  function maybeArchiveOldMatches(draft) {
    var settledMatches = draft.matches.filter(function (m) { return m.settled; });
    settledMatches.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    settledMatches.slice(ARCHIVE_KEEP_RECENT).forEach(function (m) {
      var md = draft.matchData[m.id];
      if (!md || md.archived) return;
      var rounds = md.rounds || [];
      if (rounds.length > 0) {
        md.archivedSummary = computeNetBalances(md.attendees || [], rounds, draft.settings, md.predictions || {}, m.finalScore, m.finalScoreAt);
      }
      md.archived = true; md.rounds = [];
    });
    return draft;
  }

  /* ================= render ================= */
  var root = document.getElementById("root");
  function render() {
    if (!root) return;
    if (loadError) { root.innerHTML = renderConnectError(); return; }
    var cfg = getSupaConfig();
    if (!cfg.url || !cfg.key) { root.innerHTML = renderSupaSetup(); return; }
    if (!supabaseReady) { root.innerHTML = renderLoading(); return; }
    if (!state.adminPasscode) { root.innerHTML = renderClaimAdmin(); return; }
    if (!ui.unlocked) { root.innerHTML = renderLockScreen(); return; }
    root.innerHTML = renderApp() + (ui.draw ? renderDrawOverlay() : "");
  }

  function renderDrawOverlay() {

    html += '<div class="draw-reel-box' + (locked ? " locked" : "") + '">';
    html += '<div class="draw-reel-name' + (locked ? "" : " ticking") + '">' + esc(d.spinName || "…") + "</div>";
    html += "</div>";
    html += '<div class="draw-overlay-sub">' + (locked ? "🍻 " + esc(d.spinName) + " mag halen!" : "trekken…") + "</div>";
    if (d.picked.length > 0) {

      d.picked.forEach(function (n) { html += '<div class="draw-picked-chip">✓ ' + esc(n) + "</div>"; });

    html += "</div></div>";
    return html;
  }

    html += '<button class="btn-primary" onclick="app.unlockAdmin()">' + icon("lock", 15) + " Ontgrendelen</button>";

  function getSelectedMatch() {
    var sorted = state.matches.slice().sort(function (a, b) { return a.date > b.date ? 1 : -1; });
    if (sorted.length === 0) return null;
    if (ui.explicitlyBrowsing && ui.selectedMatchId) {
      var found = sorted.find(function (m) { return m.id === ui.selectedMatchId; });
      if (found) return found;
    }
    var now = Date.now();
    var upcoming = sorted.filter(function (m) { var t = m.date ? new Date(m.date + "T" + (m.time || "23:59") + ":00").getTime() : 0; return t >= now - 3 * 60 * 60 * 1000; });
    return upcoming[0] || sorted[sorted.length - 1];
  }

  function renderApp() {
    var match = getSelectedMatch();
    var html = '<div class="shell">';
    html += '<div class="header"><div class="header-left">' + alkmaarWapen(34) + '<div><div class="header-eyebrow">AZ TRIBUNEBEURTEN</div><div class="header-title">Ome Jan Beurtbier</div></div></div>';
    html += '<button class="header-pill" onclick="app.lockAgain()" aria-label="Vergrendelen">' + icon("lock", 13) + "</button></div>";
    html += '<div class="tabbar">';
    [["wedstrijd", "Wedstrijd"], ["beurten", "Beurten"], ["afrekening", "Afrekening"], ["beheer", "Beheer"]].forEach(function (t) {
      html += '<button class="tab-btn' + (ui.activeTab === t[0] ? " active" : "") + '" onclick="app.setTab(\'' + t[0] + "')\">" + t[1] + "</button>";
    });
    html += "</div>";
    html += '<div class="main">';
    if (ui.activeTab === "beheer") html += renderBeheerTab();
    else if (!match) html += renderNoMatch();
    else if (ui.activeTab === "wedstrijd") html += renderWedstrijdTab(match);
    else if (ui.activeTab === "beurten") html += renderBeurtenTab(match);
    else html += renderAfrekeningTab(match);
    html += "</div>";
    if (savePending || saveError) {
      html += '<div style="position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:' + (saveError ? "var(--red)" : "var(--ink)") + ';color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;z-index:50">' + (saveError ? "opslaan mislukt — wordt opnieuw geprobeerd" : "opslaan…") + "</div>";
    }
    html += "</div>";
    return html;
  }
  function renderNoMatch() {
    return '<div class="empty-state"><p class="empty-title">Nog geen wedstrijden</p><p class="empty-body">Voeg een wedstrijd toe bij Beheer.</p></div>';
  }
  function renderMatchHeader(match) {
    var sorted = state.matches.slice().sort(function (a, b) { return a.date > b.date ? 1 : -1; });
    var html = "";
    if (sorted.length > 1) {
      html += '<div class="match-switch-row"><select class="match-switch-select" onchange="app.selectMatch(this.value)">';
      sorted.forEach(function (m) {
        var d = m.date ? new Date(m.date + "T12:00:00") : null;
        var mmd = state.matchData[m.id];
        var prefix = (mmd && mmd.archived ? "🗄 " : (m.settled ? "✓ " : ""));
        var label = prefix + (d ? d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) : m.date) + " · AZ–" + m.opponent;
        html += '<option value="' + m.id + '" ' + (m.id === match.id ? "selected" : "") + ">" + esc(label) + "</option>";
      });
      html += "</select></div>";
    }
    html += '<div class="match-detail-head"><div class="head-badge">' + esc(match.competition) + " · " + (match.isHome ? "Thuis" : "Uit") + '</div>';
    html += '<h2 class="match-detail-title">AZ – ' + esc(match.opponent) + "</h2>";
    var d = match.date ? new Date(match.date + "T12:00:00") : null;
    html += '<div class="match-detail-date">' + (d ? d.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" }) : "") + (match.time ? " · " + match.time : "") + "</div></div>";
    return html;
  }

  /* ---- Tabblad: Wedstrijd (aanwezigen + gokken) ---- */
  function renderWedstrijdTab(match) {
    var md = matchData(match.id);
    var members = state.members;
    var html = renderMatchHeader(match);
    if (!match.time) {
      html += '<div class="gold-note">' + icon("info", 12) + " Aftraptijd nog niet ingevuld bij Beheer — zonder aftraptijd sluit het gokken niet vanzelf op tijd.</div>";
    }
    html += '<div class="section-head" style="margin-top:0">Wie drinkt er vandaag?</div>';
    if (members.length === 0) {
      html += '<div class="empty-state"><p class="empty-body">Voeg eerst leden toe bij Beheer.</p></div>';
    } else {
      html += '<div class="card"><div class="roster-list">';
      members.forEach(function (m) {
        var on = md.attendees.indexOf(m.id) !== -1;
        html += '<div class="roster-row"><button class="checkbox' + (on ? " on" : "") + '" onclick="app.toggleAttendee(\'' + match.id + "','" + m.id + '\')" aria-label="' + esc(m.name) + '">' + (on ? icon("check", 14, ' stroke-width="3"') : "") + "</button>";
        html += '<span class="roster-name">' + esc(m.name) + "</span></div>";
      });
      html += "</div></div>";
    }

    var kickoffMs = match.date && match.time ? new Date(match.date + "T" + match.time + ":00").getTime() : null;
    var now = Date.now();
    var locked = kickoffMs ? now >= kickoffMs - 5 * 60 * 1000 : false;
    var revealed = kickoffMs ? now >= kickoffMs + 60 * 1000 : false;

    html += '<div class="section-head">Gokken op de eindstand</div>';
    html += '<div class="info-note">Tot 5 minuten voor aftrap kun je per persoon een gok invullen. Wie de uitslag goed had, drinkt tijdens de wedstrijd gratis — betaald door de andere gokkers. Na het laatste fluitsignaal betaalt iedereen gewoon weer zelf.</div>';
    if (md.attendees.length === 0) {
      html += '<div class="empty-state"><p class="empty-body">Vink hierboven eerst aan wie er is.</p></div>';
    } else {
      html += '<div class="card">';
      md.attendees.forEach(function (pid) {
        var p = md.predictions[pid];
        html += '<div class="roster-row">';
        html += '<span class="roster-name">' + esc(memberName(pid)) + "</span>";
        if (!locked || p) {
          html += '<input class="input" style="flex:0 0 46px;text-align:center;padding:7px 4px" type="number" min="0" ' + (locked ? "disabled" : "") + ' value="' + (p ? p.home : "") + '" onchange="app.setPrediction(\'' + match.id + "','" + pid + "', this.value, " + (p ? p.away : 0) + ')" />';
          html += '<span style="color:var(--muted)">–</span>';
          html += '<input class="input" style="flex:0 0 46px;text-align:center;padding:7px 4px" type="number" min="0" ' + (locked ? "disabled" : "") + ' value="' + (p ? p.away : "") + '" onchange="app.setPrediction(\'' + match.id + "','" + pid + "', " + (p ? p.home : 0) + ", this.value)\" />";
          if (p && !locked) html += '<button class="icon-btn" onclick="app.removePrediction(\'' + match.id + "','" + pid + '\')" aria-label="Verwijder gok">' + icon("x", 12) + "</button>";
        } else {
          html += '<span class="roster-sub">geen gok</span>';
        }
        html += "</div>";
      });
      html += "</div>";
      if (locked && !revealed) html += '<div class="info-note">Gokken is gesloten — uitslag wordt getoond na afloop.</div>';
    }
    if (revealed && match.finalScore) {
      var correct = md.attendees.filter(function (pid) { var p = md.predictions[pid]; return p && p.home === match.finalScore.home && p.away === match.finalScore.away; });
      html += '<div class="card"><div style="font-weight:700;font-size:13px">' + icon("trophy", 15) + " Eindstand: " + match.finalScore.home + "–" + match.finalScore.away + "</div>";
      html += '<div class="info-note" style="margin-top:6px;margin-bottom:0">' + (correct.length ? "Goed geraden door: " + esc(correct.map(memberName).join(", ")) : "Niemand had de exacte uitslag goed.") + "</div></div>";
    }
    return html;
  }

  /* ---- Tabblad: Beurten ---- */
  function renderBeurtenTab(match) {
    var md = matchData(match.id);
    var html = renderMatchHeader(match);
    html += '<div class="section-head" style="margin-top:0">Bier en beurten</div>';

    if (md.archived) {
      html += '<div class="empty-state"><p class="empty-body">' + icon("info", 14) + " Deze wedstrijd is gearchiveerd — losse beurten zijn niet meer los bewaard. Het eindbedrag staat nog volledig bij Afrekening.</p></div>";
      return html;
    }
    if (md.attendees.length === 0) {
      html += '<div class="empty-state"><p class="empty-body">Vink bij "Wedstrijd" eerst aan wie er vandaag is.</p></div>';
      return html;
    }

    var rd = ui.roundDraft && ui.roundDraft.matchId === match.id ? ui.roundDraft : null;

    // Tijdens het trekken toont het schermvullende scherm (zie
    // renderDrawOverlay, los toegevoegd in render()) alles al — hier hoeft
    // dan niets te staan.
    if (ui.draw) return html;

    if (!rd) {
      html += '<button class="btn-primary" onclick="app.startRoundDraft(\'' + match.id + '\')">' + icon("beer", 16) + " Nieuwe beurt invoeren</button>";
      html += renderRoundHistory(match, md.rounds || []);
      return html;
    }

    var wanterIds = Object.keys(rd.wanters);
    var total = wanterIds.reduce(function (s, pid) { return s + rd.wanters[pid].qty; }, 0);

    html += '<div class="card"><div class="info-note" style="margin-bottom:8px">Vink aan wie dit rondje een drankje wil, met hoeveel en wat.</div>';
    html += '<div class="roster-list">';
    md.attendees.forEach(function (pid) {
      var w = rd.wanters[pid];
      html += '<div class="roster-row"><button class="checkbox' + (w ? " on" : "") + '" onclick="app.toggleWant(\'' + pid + '\')">' + (w ? icon("check", 14, ' stroke-width="3"') : "") + "</button>";
      html += '<span class="roster-name">' + esc(memberName(pid)) + "</span>";
      if (w) {
        html += '<div class="stepper"><button class="step-btn" onclick="app.setWantQty(\'' + pid + "', " + (w.qty - 1) + ')">–</button><span class="step-count">' + w.qty + '</span><button class="step-btn" onclick="app.setWantQty(\'' + pid + "', " + (w.qty + 1) + ')">+</button></div>';
      }
      html += "</div>";
      if (w) {
        html += '<div style="display:flex;gap:6px;margin:4px 0 8px 36px">';
        ["bier", "cola", "bier0"].forEach(function (prod) {
          html += '<button class="chip-btn' + (w.product === prod ? " on" : "") + '" onclick="app.setWantProduct(\'' + pid + "','" + prod + '\')">' + productLabel(prod) + "</button>";
        });
        html += "</div>";
      }
    });
    html += "</div></div>";

    if (total > 0) {
      html += '<div class="section-head">Wie haalt?</div>';
      html += '<div class="toggle-group" style="margin-bottom:10px"><button class="toggle-btn' + (rd.mode === "auto" ? " active" : "") + '" style="flex:1" onclick="app.setRoundMode(\'auto\')">App kiest eerlijk</button><button class="toggle-btn' + (rd.mode === "manual" ? " active" : "") + '" style="flex:1" onclick="app.setRoundMode(\'manual\')">Ik wijs iemand aan</button></div>';
      if (rd.mode === "auto") {
        html += '<div class="info-note">De app loot wie haalt — hoe vaker iemand al gehaald heeft, hoe kleiner de kans dat die persoon opnieuw wordt gekozen. Bij meer dan ' + (state.settings.cupsPerRun || 8) + ' drankjes wijst de app er automatisch een tweede mens bij.</div>';
        html += '<button class="btn-primary" onclick="app.confirmAutoDraw()">' + icon("dice", 16) + " Trek wie haalt</button>";
      } else {
        html += '<div class="info-note">Bijvoorbeeld: iemand ging toch al naar de wc/bar en heeft dit al gehaald. Vink hieronder aan wie.</div>';
        html += '<div class="card"><div class="roster-list manual-haler-list">';
        md.attendees.forEach(function (pid) {
          var on = rd.manualHalers.indexOf(pid) !== -1;
          html += '<div class="roster-row"><button class="checkbox manual-haler-checkbox' + (on ? " on" : "") + '" onclick="app.toggleManualHaler(\'' + pid + '\')">' + (on ? icon("check", 14, ' stroke-width="3"') : "") + "</button><span class=\"roster-name\">" + esc(memberName(pid)) + "</span></div>";
        });
        html += "</div></div>";
        html += '<button class="btn-primary" ' + (rd.manualHalers.length === 0 ? "disabled" : "") + ' onclick="app.confirmManualRound()">' + icon("check", 16) + " Beurt vastleggen</button>";
      }
    }
    html += '<button class="btn-ghost-sm" style="width:100%;margin-top:8px;justify-content:center" onclick="app.cancelRoundDraft()">Annuleren</button>';
    html += renderRoundHistory(match, md.rounds || []);
    return html;
  }
  function renderRoundHistory(match, rounds) {
    if (rounds.length === 0) return "";
    var html = '<div class="section-head">Eerdere beurten</div><div class="reveal-list">';
    rounds.slice().reverse().forEach(function (r) {
      var idx = rounds.indexOf(r);
      var halers = roundHalers(r);
      var total = halers.reduce(function (s, h) { return s + (h.qty || 0); }, 0);
      var halerText = halers.map(function (h) { return esc(memberName(h.personId)) + " (" + h.qty + ")"; }).join(" &amp; ");
      html += '<div class="reveal-item"><span>Beurt ' + (idx + 1) + ": <b>" + (halerText || "—") + "</b> haalt " + total + " drankjes voor " + r.wanters.length + " man" + (r.manual ? " · zelf aangewezen" : "") + "</span>";
      html += '<button class="icon-btn" onclick="app.removeRound(\'' + match.id + "','" + r.id + '\')" aria-label="Verwijder">' + icon("trash", 12) + "</button></div>";
    });
    html += "</div>";
    return html;
  }

  /* ---- Tabblad: Afrekening ---- */
  function renderBreakdownTable(settlement, attendees) {
    var ids = {};
    attendees.forEach(function (pid) { ids[pid] = true; });
    Object.keys(settlement.net || {}).forEach(function (pid) { ids[pid] = true; });
    var list = Object.keys(ids).map(function (pid) { return { id: pid, name: memberName(pid) }; });
    list.sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (list.length === 0) return "";
    var html = '<div class="section-head">Volledige berekening</div>';
    html += '<div class="info-note">Wat je haalde (krediet), wat je zelf dronk (debet) en de gok-bonus/malus, opgeteld tot het nettobedrag. In <span style="color:var(--good);font-weight:700">groen</span> = jij krijgt geld, in <span style="color:var(--red);font-weight:700">rood</span> = jij moet nog betalen.</div>';
    html += '<div class="stand-table"><div class="stand-head-row" style="min-width:420px">';
    html += '<span style="font-weight:700">Naam</span><span class="stand-col">Gehaald</span><span class="stand-col">Gedronken</span><span class="stand-col">Gok</span><span class="stand-col">Netto</span></div>';
    list.forEach(function (row) {
      var bk = settlement.breakdown && settlement.breakdown[row.id];
      bk = bk || { haaldeCredit: 0, haaldeAantal: 0, dronkDebit: 0, dronkAantal: 0, gokAdjust: 0 };
      var netAmt = (settlement.net && settlement.net[row.id]) || 0;
      html += '<div class="stand-row" style="min-width:420px">';
      html += '<span class="stand-name">' + esc(row.name) + "</span>";
      html += '<span class="stand-col">' + (bk.haaldeAantal > 0 ? euro(bk.haaldeCredit) + ' <span style="color:var(--muted)">(' + bk.haaldeAantal + ")</span>" : "–") + "</span>";
      html += '<span class="stand-col">' + (bk.dronkAantal > 0 ? euroSigned(bk.dronkDebit) + ' <span style="color:var(--muted)">(' + bk.dronkAantal + ")</span>" : "–") + "</span>";
      html += '<span class="stand-col">' + (Math.abs(bk.gokAdjust) > 0.005 ? euroSigned(bk.gokAdjust) : "–") + "</span>";
      html += '<span class="stand-col" style="font-weight:700;color:' + (netAmt >= 0 ? "var(--good)" : "var(--red)") + '">' + euroSigned(netAmt) + "</span></div>";
    });
    html += "</div>";
    return html;
  }
  function renderAfrekeningTab(match) {
    var md = matchData(match.id);
    var attendees = md.attendees || [];
    var rounds = md.rounds || [];
    var predictions = md.predictions || {};
    var hasSettlement = (md.archived && md.archivedSummary) || rounds.length > 0 || (!!match.finalScore && Object.keys(predictions).length > 0);
    var settlement = md.archived && md.archivedSummary
      ? md.archivedSummary
      : (hasSettlement ? computeNetBalances(attendees, rounds, state.settings, predictions, match.finalScore, match.finalScoreAt) : { net: {}, breakdown: {}, totalBought: 0, winnerIds: [], loserIds: [] });
    var transactions = hasSettlement ? settleNet(settlement.net) : [];

    var html = renderMatchHeader(match);
    html += '<div class="section-head" style="margin-top:0">Financiële afrekening</div>';
    if (md.archived) html += '<div class="info-note">' + icon("info", 12) + " Deze wedstrijd is gearchiveerd — het eindbedrag hieronder staat vast.</div>";
    if (!hasSettlement) {
      html += '<div class="empty-state"><p class="empty-body">Nog niets om af te rekenen.</p></div>';
      return html;
    }
    html += '<div class="card"><div class="info-note" style="margin-bottom:0">' + icon("info", 12) + settlement.totalBought + " drankjes gehaald in totaal.</div></div>";
    html += renderBreakdownTable(settlement, attendees);

    if (match.settled) {
      html += '<div class="card" style="border-color:var(--good);background:#f0fbf4;display:flex;align-items:center;justify-content:space-between;gap:10px">';
      html += '<div class="good-badge">' + icon("check", 16, ' stroke-width="3"') + "Afrekening bevestigd</div>";
      if (!md.archived) html += '<button class="btn-ghost-sm" onclick="app.setMatchSettled(\'' + match.id + "', false)\">Heropenen</button>";
      html += "</div>";
    } else {
      html += '<div class="card"><div class="info-note" style="margin-bottom:8px">Heeft iedereen betaald/ontvangen? Bevestig de afrekening dan hieronder, als afvinkmoment voor de volgende wedstrijd.</div>';
      html += '<button class="btn-primary" onclick="app.setMatchSettled(\'' + match.id + '\', true)">' + icon("check", 15) + " Afrekening bevestigen</button></div>";
    }

    html += '<div class="section-head">Afrekenen</div>';
    html += '<div class="info-note">Onderlinge schulden zijn tegen elkaar weggestreept.</div>';
    if (match.finalScore && (settlement.winnerIds.length > 0 || settlement.loserIds.length > 0)) {
      var forgiven = settlement.forgivenTotal || 0;
      if (settlement.winnerIds.length > 0 && settlement.loserIds.length > 0 && forgiven > 0.005) {
        html += '<div class="info-note" style="margin-top:-6px">🎯 ' + esc(settlement.winnerIds.map(memberName).join(", ")) + " had" + (settlement.winnerIds.length === 1 ? "" : "en") + " de score goed en dronk/dronken tijdens de wedstrijd gratis (" + euro(forgiven) + ") — verdeeld over " + esc(settlement.loserIds.map(memberName).join(", ")) + ".</div>";
      }
    }
    if (transactions.length === 0) {
      html += '<div class="empty-state"><p class="empty-body">Niemand hoeft nog iets te verrekenen.</p></div>';
    } else {
      html += '<div class="settle-list">';
      transactions.forEach(function (t) {
        html += '<div class="settle-row"><span>' + esc(memberName(t.from)) + " → " + esc(memberName(t.to)) + "</span><b>" + euro(t.amt) + "</b></div>";
      });
      html += "</div>";
    }
    return html;
  }

  /* ---- Tabblad: Beheer ---- */
  function renderBeheerTab() {
    var html = '<div class="section-head" style="margin-top:0">Leden</div><div class="card">';
    html += '<div class="form-row"><input class="input" placeholder="Naam toevoegen" value="' + esc(ui.drafts.newMemberName) + '" oninput="app.setDraft(\'newMemberName\', this.value)" onkeydown="if(event.key===\'Enter\') app.addMember()" />';
    html += '<button class="btn-primary-sm" onclick="app.addMember()">' + icon("plus", 14) + "</button></div>";
    html += '<div class="member-chip-list">';
    state.members.forEach(function (m) {
      html += '<div class="member-chip">' + esc(m.name) + '<button class="chip-remove" onclick="app.removeMember(\'' + m.id + '\')" aria-label="Verwijder ' + esc(m.name) + '">' + icon("x", 11) + "</button></div>";
    });
    html += "</div></div>";

    html += '<div class="section-head">Wedstrijden</div><div class="card">';
    var nm = ui.drafts.newMatch;
    html += '<div class="form-row"><input class="input" type="date" value="' + esc(nm.date) + '" oninput="app.setDraft(\'newMatch.date\', this.value)" />';
    html += '<input class="input" type="time" value="' + esc(nm.time) + '" oninput="app.setDraft(\'newMatch.time\', this.value)" placeholder="Aftraptijd" /></div>';
    html += '<div class="form-row"><input class="input" placeholder="Tegenstander" value="' + esc(nm.opponent) + '" oninput="app.setDraft(\'newMatch.opponent\', this.value)" />';
    html += '<select class="input" onchange="app.setDraft(\'newMatch.competition\', this.value)">';
    ["Eredivisie", "KNVB Beker", "Europa League", "Conference League", "Oefenwedstrijd"].forEach(function (c) { html += '<option ' + (nm.competition === c ? "selected" : "") + ">" + c + "</option>"; });
    html += '</select></div><div class="toggle-group" style="margin-bottom:8px"><button class="toggle-btn' + (nm.isHome ? " active" : "") + '" style="flex:1" onclick="app.setNewMatchHome(true)">Thuis</button><button class="toggle-btn' + (!nm.isHome ? " active" : "") + '" style="flex:1" onclick="app.setNewMatchHome(false)">Uit</button></div>';
    html += '<button class="btn-primary-sm" onclick="app.addMatch()">Toevoegen</button></div>';

    html += '<div class="card"><div class="info-note" style="margin-bottom:6px">Bestaande wedstrijden — aftraptijd en eindstand aanpassen:</div>';
    state.matches.slice().sort(function (a, b) { return a.date > b.date ? -1 : 1; }).forEach(function (m) {
      var mmd = state.matchData[m.id];
      html += '<div class="roster-row" style="flex-wrap:wrap">';
      html += '<span class="roster-name">' + esc(m.date) + " AZ–" + esc(m.opponent) + (mmd && mmd.archived ? " 🗄" : "") + "</span>";
      html += '<input class="input" style="flex:0 0 90px" type="time" value="' + esc(m.time || "") + '" onchange="app.updateMatchTime(\'' + m.id + "', this.value)\" />";
      html += '<input class="input" style="flex:0 0 42px;text-align:center;padding:7px 2px" type="number" min="0" placeholder="-" value="' + (m.finalScore ? m.finalScore.home : "") + '" onchange="app.setMatchFinalScore(\'' + m.id + "', this.value, " + (m.finalScore ? m.finalScore.away : "null") + ')" />';
      html += '<input class="input" style="flex:0 0 42px;text-align:center;padding:7px 2px" type="number" min="0" placeholder="-" value="' + (m.finalScore ? m.finalScore.away : "") + '" onchange="app.setMatchFinalScore(\'' + m.id + "', " + (m.finalScore ? m.finalScore.home : "null") + ", this.value)\" />";
      html += '<button class="icon-btn" onclick="app.removeMatch(\'' + m.id + '\')" aria-label="Verwijder wedstrijd">' + icon("trash", 12) + "</button>";
      html += "</div>";
    });
    html += "</div>";

    html += '<div class="section-head">Prijzen & instellingen</div><div class="card">';
    [["pricePerBeer", "Bier"], ["colaPrice", "Cola"], ["bier0Price", "Bier 0.0"]].forEach(function (p) {
      html += '<div class="form-row"><span class="roster-name" style="flex:1">' + p[1] + "</span><input type=\"number\" step=\"0.10\" class=\"input\" style=\"flex:0 0 90px\" value=\"" + state.settings[p[0]] + '" onchange="app.updateSetting(\'' + p[0] + "', parseFloat(this.value)||0)\" /></div>";
    });
    html += '<div class="form-row"><span class="roster-name" style="flex:1">Max. drankjes per haal-beurt</span><input type="number" class="input" style="flex:0 0 90px" value="' + state.settings.cupsPerRun + '" onchange="app.updateSetting(\'cupsPerRun\', parseInt(this.value)||8)" /></div>';
    html += "</div>";

    html += '<div class="section-head">Beheerderscode</div><div class="card">';
    html += '<div class="info-note">Wijzig de code als je deze tijdelijk wilt delen met iemand die moet invallen (en hem daarna weer terugzet), of gewoon om de code te veranderen.</div>';
    html += '<div class="form-row"><input class="input" type="password" placeholder="Nieuwe code (min. 4 tekens)" value="' + esc(ui.drafts.passcode) + '" oninput="app.setDraft(\'passcode\', this.value)" />';
    html += '<button class="btn-primary-sm" onclick="app.changePasscode()">Opslaan</button></div></div>';

    html += '<div class="section-head">Over archivering</div><div class="card"><div class="info-note" style="margin-bottom:0">Om de app snel te houden, worden wedstrijden ouder dan de ' + ARCHIVE_KEEP_RECENT + ' meest recente automatisch samengevat zodra je ze afrekent — het eindbedrag blijft staan, de losse beurten verdwijnen dan.</div></div>';

    return html;
  }

  /* ================= boot ================= */
  document.addEventListener("keydown", function () {});
  render();
  initSupabase();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
})();
</script>
